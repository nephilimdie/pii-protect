name: pii-protect

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${PII_DB_NAME:-pii_protect}
      POSTGRES_USER: ${PII_DB_USER:-pii_protect}
      POSTGRES_PASSWORD: ${PII_DB_PASSWORD:-changeme_secret}
    volumes:
      - pii_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${PII_DB_PORT:-15433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PII_DB_USER:-pii_protect}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "${PII_API_PORT:-15500}:8000"
    expose:
      - "50051"
    environment:
      DATABASE_URL: postgresql+asyncpg://${PII_DB_USER:-pii_protect}:${PII_DB_PASSWORD:-changeme_secret}@postgres:5432/${PII_DB_NAME:-pii_protect}
      ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-CHANGE_ME_generate_with_python_-c_from_cryptography.fernet_import_Fernet_print_Fernet.generate_key().decode()}
      ADMIN_INITIAL_KEY: ${PII_ADMIN_INITIAL_KEY:-CHANGE_ME_initial_admin_key}
      FAILURE_MODE: ${PII_FAILURE_MODE:-closed}
      BATCH_MAX_ITEMS: ${PII_BATCH_MAX_ITEMS:-50}
      MULTITENANCY_ENABLED: ${PII_MULTITENANCY_ENABLED:-false}
      PII_GRPC_ENABLED: ${PII_GRPC_ENABLED:-false}
      PII_GRPC_HOST: ${PII_GRPC_HOST:-0.0.0.0}
      PII_GRPC_PORT: ${PII_GRPC_PORT:-50051}
      PII_MODEL_CACHE_DIR: ${PII_MODEL_CACHE_DIR:-/root/.cache/huggingface}
      PII_IMAGE_MAX_BYTES: ${PII_IMAGE_MAX_BYTES:-4000000}
      PII_IMAGE_MAX_PIXELS: ${PII_IMAGE_MAX_PIXELS:-25000000}
      PII_DATA_RESIDENCY_REGION: ${PII_DATA_RESIDENCY_REGION:-unspecified}
      PII_REQUIRE_DATA_RESIDENCY: ${PII_REQUIRE_DATA_RESIDENCY:-false}
      SPACY_MODEL: it_core_news_lg
      PRIVACY_FILTER_REVISION: ${PII_PRIVACY_FILTER_REVISION:-7ffa9a043d54d1be65afb281eddf0ffbe629385b}
      AI4PRIVACY_REVISION: ${PII_AI4PRIVACY_REVISION:-11795a7549030bb5a21832b09e712b19d39045a7}
      PLUGIN_DIR: ${PLUGIN_DIR:-./plugins}
      PLUGIN_AUTOLOAD: ${PLUGIN_AUTOLOAD:-false}
      DOCUMENT_MAX_BYTES: ${PII_DOCUMENT_MAX_BYTES:-4000000}
      DOCUMENT_MAX_PAGES: ${PII_DOCUMENT_MAX_PAGES:-10}
      MARKETPLACE_URL: ${MARKETPLACE_URL:-}
      MARKETPLACE_TOKEN: ${MARKETPLACE_TOKEN:-}
      MARKETPLACE_PUBLIC_KEY: ${MARKETPLACE_PUBLIC_KEY:-}
      MARKETPLACE_TIMEOUT_SECONDS: ${MARKETPLACE_TIMEOUT_SECONDS:-10}
      MARKETPLACE_MAX_PACKAGE_BYTES: ${MARKETPLACE_MAX_PACKAGE_BYTES:-50000000}
    volumes:
      - pii_hf_cache:${PII_MODEL_CACHE_DIR:-/root/.cache/huggingface}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    profiles: ["async-jobs"]
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${PII_DB_USER:-pii_protect}:${PII_DB_PASSWORD:-changeme_secret}@postgres:5432/${PII_DB_NAME:-pii_protect}
      ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-CHANGE_ME_generate_with_python_-c_from_cryptography.fernet_import_Fernet_print_Fernet.generate_key().decode()}
      ASYNC_JOB_WORKER_API_URL: ${ASYNC_JOB_WORKER_API_URL:-http://api:8000}
      ASYNC_JOB_POLL_SECONDS: ${ASYNC_JOB_POLL_SECONDS:-1}
      ASYNC_JOB_MAX_ATTEMPTS: ${ASYNC_JOB_MAX_ATTEMPTS:-3}
      ASYNC_JOB_WEBHOOK_HOSTS: ${ASYNC_JOB_WEBHOOK_HOSTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "${PII_UI_PORT:-15501}:80"
    depends_on:
      - api

volumes:
  pii_postgres_data:
  pii_hf_cache:
