name: CI Engine

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  open-core-hygiene:
    name: Open-core packaging hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject hosted deployment artifacts
        run: |
          if git ls-files | grep -E '(^|/)\.DS_Store$'; then
            echo 'Tracked .DS_Store file found' >&2
            exit 1
          fi
          if rg -n 'pseudora\.cloud' docker README.md .env.example 2>/dev/null; then
            echo 'Hosted SaaS domain found in self-hosted packaging' >&2
            exit 1
          fi

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      ENCRYPTION_KEY: test-encryption-key-32chars-long!!
      ADMIN_INITIAL_KEY: test-admin-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        run: pytest tests/unit/ -q --tb=short

      - name: Run synthetic quality benchmark
        run: python -m app.reporting.benchmark

  postgres-migrations:
    name: PostgreSQL migration smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: pii_protect_ci
          POSTGRES_USER: pii_protect
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pii_protect -d pii_protect_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: api

    env:
      DATABASE_URL: postgresql+asyncpg://pii_protect:ci_password@127.0.0.1:5432/pii_protect_ci
      ADMIN_INITIAL_KEY: ci-test-admin-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install migration dependencies
        run: |
          pip install -r requirements-test.txt
          pip install asyncpg==0.30.0

      - name: Generate test encryption key
        run: |
          python -c "from cryptography.fernet import Fernet; print('ENCRYPTION_KEY=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"

      - name: Upgrade PostgreSQL schema
        run: alembic upgrade head

      - name: Verify tenant-scoped schema
        run: |
          python - <<'PY'
          import asyncio
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main():
              engine = create_async_engine("postgresql+asyncpg://pii_protect:ci_password@127.0.0.1:5432/pii_protect_ci")
              async with engine.connect() as conn:
                  tables = {
                      row[0]
                      for row in (await conn.execute(text("SELECT tablename FROM pg_tables WHERE schemaname = 'public'"))).all()
                  }
                  required = {"pii_mappings", "usage_events", "audit_logs", "scoped_config_overrides", "anonymization_jobs"}
                  missing = required - tables
                  if missing:
                      raise SystemExit(f"missing tables: {sorted(missing)}")
              await engine.dispose()

          asyncio.run(main())
          PY

  postgres-restore-drill:
    name: PostgreSQL restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: pii_protect_ci
          POSTGRES_USER: pii_protect
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pii_protect -d pii_protect_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Create disposable backup and restore target
        run: |
          docker run --rm --network host -v "$GITHUB_WORKSPACE:/workspace" postgres:17 \
            bash -euc '
              export PGPASSWORD=ci_password
              psql -h 127.0.0.1 -U pii_protect -d pii_protect_ci \
                -c "CREATE TABLE restore_fixture (id integer PRIMARY KEY, value text NOT NULL); INSERT INTO restore_fixture VALUES (1, '''ok''');"
              pg_dump -h 127.0.0.1 -U pii_protect -Fc pii_protect_ci | gzip > /workspace/ci-restore.dump.gz
              createdb -h 127.0.0.1 -U pii_protect pii_protect_restore
            '

      - name: Run guarded restore drill
        run: |
          docker run --rm --network host \
            -e RESTORE_DRILL=1 \
            -e PII_ENVIRONMENT=ci \
            -e BACKUP_FILE=/workspace/ci-restore.dump.gz \
            -e PII_DB_NAME=pii_protect_restore \
            -e PII_DB_USER=pii_protect \
            -e PII_DB_PASSWORD=ci_password \
            -v "$GITHUB_WORKSPACE:/workspace" \
            postgres:17 bash -euc '
              /workspace/scripts/restore-drill.sh
              test "$(psql -h 127.0.0.1 -U pii_protect -d pii_protect_restore -Atc "SELECT value FROM restore_fixture WHERE id = 1")" = ok
            '

  security:
    name: Dependency and static security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit bandit

      - name: Audit runtime dependencies
        run: pip-audit -r api/requirements.txt

      - name: Run high-confidence static security checks
        run: bandit -q --severity-level high -r api/app -x api/tests
