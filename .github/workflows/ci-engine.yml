name: CI Engine

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    env:
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      ENCRYPTION_KEY: test-encryption-key-32chars-long!!
      ADMIN_INITIAL_KEY: test-admin-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        run: pytest tests/unit/ -q --tb=short
