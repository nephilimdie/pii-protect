name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests & coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
            api/requirements-test.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt -r api/requirements-dev.txt -r api/requirements-test.txt

      - name: Run unit tests with coverage
        working-directory: api
        run: |
          pytest tests/unit/ \
            --cov=app/surrogates \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: api/coverage.xml
          flags: unit
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Run ruff
        run: ruff check api/app/surrogates/ api/app/detection/entities.py

  italian-benchmark:
    name: Italian PII benchmark (harness + reproducible scores)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest==8.3.3

      - name: Unit tests (generator determinism, scorer, report)
        run: python -m pytest benchmark/italian/tests benchmark/italian_heldout/tests benchmark/italian_heldout_v2/tests -q

      - name: Re-score committed predictions and re-render report; fail on any drift
        run: |
          python benchmark/italian/score.py --predictions benchmark/italian/results/predictions --out benchmark/italian/results/summary.json
          python benchmark/italian/report.py --results benchmark/italian/results
          git diff --exit-code -- benchmark/italian

      - name: Held-out corpus is the frozen one; re-score held-out predictions; fail on any drift
        run: |
          python benchmark/italian_heldout/build.py --check
          python benchmark/italian_heldout_v2/build.py --check
          python benchmark/italian/score.py --dataset benchmark/italian_heldout/dataset/it_pii_heldout_v1.jsonl --predictions benchmark/italian_heldout/results/predictions --out benchmark/italian_heldout/results/summary.json
          python benchmark/italian/report.py --results benchmark/italian_heldout/results
          python benchmark/italian_heldout/compare.py
          git diff --exit-code -- benchmark/

  e2e:
    name: E2E tests (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    needs: unit-tests

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Create .env from example
        # Throwaway CI values. The admin key matches the local-dev key the
        # E2E suite logs in with (tests/e2e/conftest.py, test_ui.py).
        run: |
          fernet_key=$(python3 -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          sed -e "s|^PII_ENCRYPTION_KEY=.*|PII_ENCRYPTION_KEY=${fernet_key}|" \
              -e "s|^PII_ADMIN_INITIAL_KEY=.*|PII_ADMIN_INITIAL_KEY=${E2E_ADMIN_KEY}|" \
              .env.example > .env
        env:
          E2E_ADMIN_KEY: pii-admin-local-dev-key

      - name: Build and start services
        run: docker compose up --build -d

      - name: Install test dependencies
        run: pip install -r api/requirements-dev.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('api/requirements-dev.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Wait for API readiness
        # /readiness (not /health) gates on DB, migrations and loaded detectors.
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:15500/readiness > /dev/null 2>&1; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 10
          done
          echo "API did not become ready in time"
          curl -s http://localhost:15500/readiness || true
          docker compose logs api
          exit 1

      - name: Run E2E tests
        env:
          E2E_ADMIN_KEY: pii-admin-local-dev-key
        run: pytest tests/e2e/ -v --timeout=60

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
