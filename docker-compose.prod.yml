name: pii-protect-prod

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - ui
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    expose:
      - "8000"
      - "50051"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${PII_DB_USER:-pii_protect}:${PII_DB_PASSWORD:?PII_DB_PASSWORD must be set}@postgres:5432/${PII_DB_NAME:-pii_protect}
      ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?PII_ENCRYPTION_KEY must be set}
      ADMIN_INITIAL_KEY: ${PII_ADMIN_INITIAL_KEY:?PII_ADMIN_INITIAL_KEY must be set}
      FAILURE_MODE: ${PII_FAILURE_MODE:-closed}
      BATCH_MAX_ITEMS: ${PII_BATCH_MAX_ITEMS:-50}
      MULTITENANCY_ENABLED: ${PII_MULTITENANCY_ENABLED:-false}
      PII_GRPC_ENABLED: ${PII_GRPC_ENABLED:-false}
      PII_GRPC_HOST: ${PII_GRPC_HOST:-0.0.0.0}
      PII_GRPC_PORT: ${PII_GRPC_PORT:-50051}
      PII_MODEL_CACHE_DIR: ${PII_MODEL_CACHE_DIR:-/root/.cache/huggingface}
      PII_IMAGE_MAX_BYTES: ${PII_IMAGE_MAX_BYTES:-4000000}
      PII_IMAGE_MAX_PIXELS: ${PII_IMAGE_MAX_PIXELS:-25000000}
      PII_DATA_RESIDENCY_REGION: ${PII_DATA_RESIDENCY_REGION:-unspecified}
      PII_REQUIRE_DATA_RESIDENCY: ${PII_REQUIRE_DATA_RESIDENCY:-false}
      PII_ACCEPT_TENANT_HEADER: ${PII_ACCEPT_TENANT_HEADER:-false}
      PII_INTERNAL_API_KEY: ${PII_INTERNAL_API_KEY:-}
      PII_CORS_ALLOWED_ORIGINS: ${PII_CORS_ALLOWED_ORIGINS:?Set explicit CORS origins in production}
      SPACY_MODEL: ${PII_SPACY_MODEL:-it_core_news_lg}
      PRIVACY_FILTER_MODEL: ${PII_PRIVACY_FILTER_MODEL:-openai/privacy-filter}
      PRIVACY_FILTER_REVISION: ${PII_PRIVACY_FILTER_REVISION:-7ffa9a043d54d1be65afb281eddf0ffbe629385b}
      AI4PRIVACY_MODEL: ${PII_AI4PRIVACY_MODEL:-Isotonic/distilbert_finetuned_ai4privacy_v2}
      AI4PRIVACY_REVISION: ${PII_AI4PRIVACY_REVISION:-11795a7549030bb5a21832b09e712b19d39045a7}
      PLUGIN_DIR: ${PLUGIN_DIR:-./plugins}
      PLUGIN_AUTOLOAD: ${PLUGIN_AUTOLOAD:-false}
      DOCUMENT_MAX_BYTES: ${PII_DOCUMENT_MAX_BYTES:-4000000}
      DOCUMENT_MAX_PAGES: ${PII_DOCUMENT_MAX_PAGES:-10}
      PII_DOCUMENT_UPLOAD_MAX_BYTES: ${PII_DOCUMENT_UPLOAD_MAX_BYTES:-20000000}
      PII_DOCUMENT_UPLOAD_MAX_PAGES: ${PII_DOCUMENT_UPLOAD_MAX_PAGES:-200}
      PII_DOCUMENT_TIMEOUT_SECONDS: ${PII_DOCUMENT_TIMEOUT_SECONDS:-60}
      PII_DOCUMENT_PDF_DPI: ${PII_DOCUMENT_PDF_DPI:-200}
      PII_DOCUMENT_PDF_MAX_PAGE_PIXELS: ${PII_DOCUMENT_PDF_MAX_PAGE_PIXELS:-16000000}
      PII_DOCUMENT_PDF_MIN_DPI: ${PII_DOCUMENT_PDF_MIN_DPI:-50}
      PII_DOCUMENT_MAX_TEXT_CHARS: ${PII_DOCUMENT_MAX_TEXT_CHARS:-500000}
      PII_DOCUMENT_DETECTION_WINDOW_CHARS: ${PII_DOCUMENT_DETECTION_WINDOW_CHARS:-6000}
      PII_DOCUMENT_DETECTION_WINDOW_OVERLAP: ${PII_DOCUMENT_DETECTION_WINDOW_OVERLAP:-300}
      PII_DOCUMENT_MAX_CONCURRENT_JOBS: ${PII_DOCUMENT_MAX_CONCURRENT_JOBS:-2}
      PII_DOCUMENT_BUSY_TIMEOUT_SECONDS: ${PII_DOCUMENT_BUSY_TIMEOUT_SECONDS:-2}
      PII_DOCUMENT_MAX_RSS_MB: ${PII_DOCUMENT_MAX_RSS_MB:-0}
      PII_DOCUMENT_DOCX_MAX_ENTRIES: ${PII_DOCUMENT_DOCX_MAX_ENTRIES:-1000}
      PII_DOCUMENT_DOCX_MAX_UNCOMPRESSED_BYTES: ${PII_DOCUMENT_DOCX_MAX_UNCOMPRESSED_BYTES:-100000000}
      PII_DOCUMENT_DOCX_MAX_RATIO: ${PII_DOCUMENT_DOCX_MAX_RATIO:-100}
      PII_DOCUMENT_DETECTION_WORKERS: ${PII_DOCUMENT_DETECTION_WORKERS:-4}
      PII_DOCUMENT_JOB_TTL_SECONDS: ${PII_DOCUMENT_JOB_TTL_SECONDS:-900}
      PII_DOCUMENT_MAX_JOBS: ${PII_DOCUMENT_MAX_JOBS:-20}
      PII_DOCUMENT_MAX_JOB_BYTES_TOTAL: ${PII_DOCUMENT_MAX_JOB_BYTES_TOTAL:-1000000000}
      PII_DOCUMENT_JOB_MAX_TEXT_CHARS: ${PII_DOCUMENT_JOB_MAX_TEXT_CHARS:-500000}
      MARKETPLACE_URL: ${MARKETPLACE_URL:-}
      MARKETPLACE_TOKEN: ${MARKETPLACE_TOKEN:-}
      MARKETPLACE_PUBLIC_KEY: ${MARKETPLACE_PUBLIC_KEY:-}
      MARKETPLACE_TIMEOUT_SECONDS: ${MARKETPLACE_TIMEOUT_SECONDS:-10}
      MARKETPLACE_MAX_PACKAGE_BYTES: ${MARKETPLACE_MAX_PACKAGE_BYTES:-50000000}
    volumes:
      - pii_hf_cache:${PII_MODEL_CACHE_DIR:-/root/.cache/huggingface}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    profiles: ["async-jobs"]
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${PII_DB_USER:-pii_protect}:${PII_DB_PASSWORD:?PII_DB_PASSWORD must be set}@postgres:5432/${PII_DB_NAME:-pii_protect}
      ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?PII_ENCRYPTION_KEY must be set}
      ASYNC_JOB_WORKER_API_URL: ${ASYNC_JOB_WORKER_API_URL:-http://api:8000}
      ASYNC_JOB_POLL_SECONDS: ${ASYNC_JOB_POLL_SECONDS:-1}
      ASYNC_JOB_MAX_ATTEMPTS: ${ASYNC_JOB_MAX_ATTEMPTS:-3}
      ASYNC_JOB_WEBHOOK_HOSTS: ${ASYNC_JOB_WEBHOOK_HOSTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${PII_DB_PASSWORD:?PII_DB_PASSWORD must be set}
      PII_DB_NAME: ${PII_DB_NAME:-pii_protect}
      PII_DB_USER: ${PII_DB_USER:-pii_protect}
    command: ["/bin/sh", "/scripts/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pii_postgres_backups:/backups
      - ./docker/postgres/backup.sh:/scripts/backup.sh:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  monitoring:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${PII_DB_NAME:-pii_protect}
      POSTGRES_USER: ${PII_DB_USER:-pii_protect}
      POSTGRES_PASSWORD: ${PII_DB_PASSWORD:?PII_DB_PASSWORD must be set}
    volumes:
      - pii_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PII_DB_USER:-pii_protect}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pii_postgres_data:
  pii_postgres_backups:
  pii_hf_cache:
